  function lang() {
    var l = (document.documentElement.lang || navigator.language || "en").slice(0, 2).toLowerCase();
    return T[l] ? l : "en";
  }
  function paint() {
    var t = T[lang()];
    box.querySelector(".bfep-wl-title").textContent = t.title;
    box.querySelector(".bfep-wl-sub").textContent = t.sub;
    box.querySelector(".bfep-wl-coins").textContent = t.coins;

    box.querySelector(".bfep-wl-consent-text").textContent = t.consent;
    box.querySelector(".bfep-wl-privacy").textContent = t.privacy;
  }
  paint();
  new MutationObserver(paint).observe(document.documentElement, {attributes: true, attributeFilter: ["lang"]});
  // 200 монет (Искр) один раз на этот браузер: общий кошелёк приложения bfe-sparks на том же сайте (bfep.space/app)
  function coins() {
    try {
      var K = "bfe-sparks", w = JSON.parse(localStorage.getItem(K) || "null") || {};
      w.ever = w.ever || {}; if (w.ever.waitlist) return false;
      ["bal", "total", "all"].forEach(function (k) { w[k] = (Math.max(0, Math.floor(+w[k] || 0))) + 200; });
      w.ever.waitlist = 1; localStorage.setItem(K, JSON.stringify(w));
      try { if (window.BFEP && BFEP.track) BFEP.track("waitlist_coins", {n: 200}); } catch (e) {}
      return true;
    } catch (e) { return false; }
  }
  function param(n) { try { return new URLSearchParams(location.search).get(n) || ""; } catch (e) { return ""; } }
