<!-- ===== BFEP: форма листа ожидания (Brevo) v1.2 =====
Куда вставить: на главную bfep.space (блок перед «Подписывайтесь») и на страницы игр bfep.space/<игра>.
На странице игры укажите игру: data-game="bluff" (bfep, bluff, daily, sayit, kmg). На главной оставьте data-game="all".
Язык берётся из <html lang="..">; при смене языка на сайте форма переключается сама.
Адреса форм Brevo (6 штук) вписаны 26.10.2026. Это не секрет.
-->
<section id="waitlist" class="bfep-wl" data-game="all">
  <h2 class="bfep-wl-title"></h2>
  <p class="bfep-wl-sub"></p>
  <form class="bfep-wl-form" novalidate>
    <input class="bfep-wl-email" type="email" name="EMAIL" autocomplete="email" required>
    <input type="text" name="email_address_check" value="" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
    <button class="bfep-wl-btn" type="submit"></button>
    <label class="bfep-wl-consent"><input type="checkbox" name="OPT_IN" value="1"> <span class="bfep-wl-consent-text"></span> <a href="/privacy.html" class="bfep-wl-privacy"></a></label>
    <p class="bfep-wl-msg" role="status" aria-live="polite"></p>
  </form>
</section>
<style>
  .bfep-wl,.bfep-wl *{box-sizing:border-box}
  .bfep-wl{max-width:560px;margin:32px auto;width:calc(100% - 32px);padding:24px 20px;border-radius:16px;background:#2B1B4A;color:#fff;text-align:center;font-family:inherit}
  .bfep-wl-title{margin:0 0 6px;font-size:24px}
  .bfep-wl-sub{margin:0 0 16px;opacity:.85}
  .bfep-wl-form{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;position:relative}
  .bfep-wl-email{flex:1 1 240px;min-width:0;padding:14px;border-radius:10px;border:0;font-size:16px;background:#fff;color:#12242B}
  .bfep-wl-btn{flex:0 0 auto;padding:14px 22px;border:0;border-radius:10px;background:#E8553D;color:#fff;font-weight:bold;font-size:16px;cursor:pointer}
  .bfep-wl-btn[disabled]{opacity:.6}
  .bfep-wl-consent{flex:1 1 100%;font-size:13px;opacity:.85;text-align:left;line-height:1.4}
  .bfep-wl-consent a{color:#FFC9BE}
  .bfep-wl-msg{flex:1 1 100%;margin:4px 0 0;min-height:1.4em;font-weight:bold}
</style>

  var box = document.getElementById("waitlist");
  if (!box) return;
  var form = box.querySelector("form"), msg = box.querySelector(".bfep-wl-msg"), btn = box.querySelector(".bfep-wl-btn");
  function lang() {
    var l = (document.documentElement.lang || navigator.language || "en").slice(0, 2).toLowerCase();
    return T[l] ? l : "en";
  }
  function paint() {
    var t = T[lang()];
    box.querySelector(".bfep-wl-title").textContent = t.title;
    box.querySelector(".bfep-wl-sub").textContent = t.sub;
    box.querySelector(".bfep-wl-email").placeholder = t.ph;
    btn.textContent = t.btn;
    box.querySelector(".bfep-wl-consent-text").textContent = t.consent;
    box.querySelector(".bfep-wl-privacy").textContent = t.privacy;
  }
  paint();
  new MutationObserver(paint).observe(document.documentElement, {attributes: true, attributeFilter: ["lang"]});
  function param(n) { try { return new URLSearchParams(location.search).get(n) || ""; } catch (e) { return ""; } }
  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var l = lang(), t = T[l], email = form.EMAIL.value.trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { msg.textContent = t.bad; return; }
    if (!form.OPT_IN.checked) { msg.textContent = t.need; return; }
    if (form.email_address_check.value) return; // бот
    var fd = new FormData();
    fd.append("EMAIL", email);
    fd.append("OPT_IN", "1");
    fd.append("email_address_check", "");
    fd.append("locale", l);
    fd.append("html_type", "simple");
    fd.append("GAME", box.getAttribute("data-game") || "all");
    fd.append("SOURCE", param("utm_source") || param("src") || (document.referrer ? new URL(document.referrer).hostname : "direct"));

    btn.disabled = true;
    fetch(FORMS[l] || FORMS.en, {method: "POST", body: fd, mode: "no-cors"})
      .then(function () { msg.textContent = t.ok; form.reset(); })
      .catch(function () { msg.textContent = t.err; })
      .then(function () { btn.disabled = false; });
