<style>@font-face{font-family:'Fredoka';font-weight:300 700;font-display:swap;src:url('/fonts/Fredoka-Variable.ttf') format('truetype')}
@font-face{font-family:'Nunito';font-weight:200 1000;font-display:swap;src:url('/fonts/Nunito-Variable.ttf') format('truetype')}
:root{--bg:#0F3B47;--bg2:#0B2E38;--paper:#FFF8EA;--ink:#12242B;--sun:#FFC83D;--coral:#FF6A4D;--muted:#5A6B70;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg2)}
body{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans CJK SC',sans-serif;font-weight:600;background:radial-gradient(120% 70% at 50% 0%,var(--bg),var(--bg2)) fixed;color:var(--paper);min-height:100vh;line-height:1.5;padding:calc(28px + env(safe-area-inset-top)) 16px 40px}
main{max-width:960px;margin:0 auto}
h1,h2,h3,.btn,.fred{font-family:'Fredoka','Nunito',system-ui,sans-serif}
a{color:var(--sun)}
.langs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:18px 0 6px}
.langs button{font:inherit;font-weight:800;border:2px solid rgba(255,248,234,.35);background:transparent;color:var(--paper);border-radius:999px;padding:6px 13px;cursor:pointer}
.langs button.sel{background:var(--sun);color:var(--ink);border-color:var(--sun)}
.langs button:focus-visible,.btn:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
footer{text-align:center;margin-top:34px;font-size:.9rem;opacity:.8;line-height:1.9}
footer a{color:var(--paper)}

header{text-align:center;padding:6px 0 18px}
.family{display:flex;justify-content:center;gap:10px;margin-bottom:14px}
.family img{width:58px;height:58px;border-radius:15px;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.family img:nth-child(odd){transform:rotate(-6deg)} .family img:nth-child(even){transform:rotate(5deg) translateY(4px)}
h1{font-size:clamp(2rem,6vw,2.8rem);line-height:1.05;font-weight:700;text-wrap:balance}
.sub{color:var(--sun);font-size:1.15rem;font-weight:800;margin-top:6px}
p.lead{margin:12px auto 0;max-width:56ch;opacity:.9}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;margin-top:22px}
.card{background:var(--paper);color:var(--ink);border-radius:24px;padding:18px;box-shadow:0 12px 30px rgba(0,0,0,.3);display:grid;grid-template-columns:88px 1fr;gap:6px 16px;align-items:start;scroll-margin-top:20px;border-top:8px solid var(--c)}
.card:target{outline:4px solid var(--sun);outline-offset:3px}
.card img{width:88px;height:88px;border-radius:22px;grid-row:span 2;box-shadow:0 6px 14px rgba(0,0,0,.2)}
.card h2{font-size:1.4rem;line-height:1.15;font-weight:700}
.card .tag{font-size:.9rem;font-weight:800;color:var(--c)}
.card p{grid-column:1/-1;font-size:.98rem;margin-top:4px}
.card .who{grid-column:1/-1;font-size:.85rem;color:var(--muted);font-weight:700}
.acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.btn{display:inline-block;background:var(--c);color:#fff;border-radius:14px;padding:11px 18px;font-weight:600;font-size:1.02rem;text-decoration:none;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.badge{border:2px solid rgba(18,36,43,.18);color:var(--muted);border-radius:12px;padding:8px 11px;font-size:.8rem;font-weight:800;white-space:nowrap}
.soon{grid-column:1/-1;font-size:.78rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.note{text-align:center;opacity:.75;font-size:.88rem;margin-top:14px}
.pass{margin-top:26px;background:rgba(255,248,234,.07);border:2px solid rgba(255,200,61,.5);border-radius:22px;padding:18px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.pass .em{font-size:2.4rem}.pass div{flex:1;min-width:220px}.pass h3{font-size:1.25rem;font-weight:600;margin-bottom:2px}.pass p{opacity:.9;font-size:.95rem}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin:22px 0 0}
.feat div{background:rgba(255,248,234,.07);border-radius:16px;padding:12px;text-align:center;font-weight:800;font-size:.92rem}
.feat b{display:block;font-size:1.5rem;margin-bottom:2px}
.age{display:inline-block;vertical-align:middle;font-size:.75rem;font-weight:800;background:var(--ink);color:var(--paper);border-radius:8px;padding:2px 7px;margin-left:4px}
.social{text-align:center;margin-top:28px}
.social p{font-weight:800;opacity:.9;margin-bottom:10px}
.social div{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.social a{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:16px;background:rgba(255,248,234,.1);color:var(--paper);transition:background .15s}
.social a:hover,.social a:focus-visible{background:var(--sun);color:var(--ink);outline:none}

.one{max-width:520px;margin:0 auto}
.one .card{display:block;text-align:center;padding:22px 20px 20px}
.one .card img.ic{width:104px;height:104px;border-radius:26px;margin:0 auto 10px;display:block;box-shadow:0 6px 14px rgba(0,0,0,.2)}
.one .card p{margin:8px 0 0}
.free{color:var(--muted);font-size:.85rem;font-weight:800;margin-top:6px}
#acts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
#acts .btn{display:block;text-align:center}
#acts .big{font-size:1.15rem;padding:14px 18px}
#acts .ghost{background:transparent;color:var(--ink);border:2px solid var(--c);box-shadow:none}
#acts .store{background:var(--ink)}
#acts .small{font-size:.85rem;color:var(--muted);font-weight:800}
#qr{margin-top:18px;padding-top:16px;border-top:2px dashed rgba(18,36,43,.15)}
#qr svg{width:170px;height:170px;display:block;margin:0 auto 6px}
#qr p{font-size:.85rem;color:var(--muted);font-weight:800}
.back{display:block;text-align:center;margin-top:18px;color:var(--paper);opacity:.85}
</style></head>
