<style>@font-face{font-family:'Fredoka';font-weight:300 700;font-display:swap;src:url('/fonts/Fredoka-Variable.ttf') format('truetype')}
@font-face{font-family:'Nunito';font-weight:200 1000;font-display:swap;src:url('/fonts/Nunito-Variable.ttf') format('truetype')}
:root{--bg:#0F3B47;--bg2:#0B2E38;--paper:#FFF8EA;--ink:#12242B;--sun:#FFC83D;--coral:#FF6A4D;--muted:#5A6B70;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg2)}
body{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans CJK SC',sans-serif;font-weight:600;background:radial-gradient(120% 70% at 50% 0%,var(--bg),var(--bg2)) fixed;color:var(--paper);min-height:100vh;line-height:1.5;padding:calc(28px + env(safe-area-inset-top)) 16px 40px}
main{max-width:960px;margin:0 auto}

a{color:var(--sun)}
.langs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:18px 0 6px}

.langs button.sel{background:var(--sun);color:var(--ink);border-color:var(--sun)}
.langs button:focus-visible,.btn:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
footer{text-align:center;margin-top:34px;font-size:.9rem;opacity:.8;line-height:1.9}
footer a{color:var(--paper)}

main{max-width:720px}
.back{display:inline-block;color:var(--paper);opacity:.8;text-decoration:none;font-weight:800;margin-bottom:12px}
h1{font-size:2.2rem;font-weight:700}
.lead{opacity:.9;margin-top:6px;max-width:60ch}
.mail{background:var(--paper);color:var(--ink);border-radius:22px;padding:18px 20px;margin-top:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.mail .lbl{font-size:.8rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.mail .addr{font-family:'Fredoka','Nunito',sans-serif;font-size:1.5rem;font-weight:600;user-select:all;word-break:break-all}
.mail div{flex:1;min-width:200px}

details[open] summary::after{content:'−'}
details p{padding:0 16px 14px;opacity:.9}
.games{display:flex;gap:8px;margin-top:22px}.games img{width:44px;height:44px;border-radius:11px}

vacy": "Datenschutzerklärung", "support": "Support", "copy": "© 2026 Best Fun Evening", "q1": "Brauche ich Internet oder ein Konto?", "a1": "Nein. Alle vier Spiele funktionieren offline, ohne Registrierung und ohne Konto.", "q2": "Wie ändere ich die Sprache?", "a2": "Tippe auf dem Startbildschirm des Spiels auf eine der Sprachschaltflächen oder öffne ⚙️ „Einstellungen“ → „Sprache“.", "q3": "Wie lösche ich Punkte oder Statistiken?", "a3": "Öffne ⚙️ „Einstellungen“. Best Fun Evening Plan! und Bluff Night: „Abendwertung löschen“. Three Clues Daily: „Statistik zurücksetzen“. Say It!: „Gespielte Karten zurücksetzen“.", "q4": "Ein Hinweis oder eine Frage ist falsch oder unpassend.", "a4": "Schick uns bitte einen Screenshot und nenne uns Spiel und Sprache. Wir prüfen jede Meldung und korrigieren den Fehler im nächsten Update.", "q5": "Was ist die Stimmung „Erwachsene 18+“ in Say It!?", "a5": "Sie ergänzt offene Fragen rund um Beziehungen für Erwachsene. Das Spiel fragt einmal, ob alle mindestens 18 sind, und diese Karten erscheinen nur, wenn ihr diese Stimmung auswählt. Die Stimmung „Familie“ passt für alle.", "q6": "Ich habe den Evening Pass gekauft – wie stelle ich ihn wieder her?", "a6": "Der Evening Pass kommt bald. Nach dem Kauf kannst du ihn auf einem anderen Gerät über ⚙️ „Einstellungen“ → „Käufe wiederherstellen“ wiederherstellen – mit demselben App Store- oder Google Play-Konto.", "q7": "Was passiert mit unseren Namen und Punkten?", "a7": "Sie werden nur auf deinem Gerät gespeichert und nie an uns gesendet. Details findest du in der Datenschutzerklärung."}, "es": {"back": "← bfep.space", "s_title": "Soporte", "s_lead": "¿Tienes preguntas o ideas, o encontraste una pista o pregunta incorrecta? Escríbenos: solemos responder en un plazo de dos días hábiles.", "s_mail": "Correo electrónico", "s_copy": "Copiar dirección", "s_copied": "Copiado", "s_faq": "Preguntas frecuentes", "privacy": "Política de privacidad", "support": "Soporte", "copy": "© 2026 Best Fun Evening", "q1": "¿Necesito internet o una cuenta?", "a1": "No. Los cuatro juegos funcionan sin conexión, sin registro y sin cuenta.", "q2": "¿Cómo cambio el idioma?", "a2": "Toca uno de los botones de idioma en la pantalla de inicio del juego o abre ⚙️ «Ajustes» → «Idioma».", "q3": "¿Cómo borro los puntos o las estadísticas?", "a3": "Abre ⚙️ «Ajustes». Best Fun Evening Plan! y Bluff Night: «Borrar puntos de la noche». Three Clues Daily: «Restablecer estadísticas». Say It!: «Reiniciar cartas jugadas».", "q4": "Una pista o pregunta es incorrecta o inapropiada.", "a4": "Envíanos una captura de pantalla e indícanos el juego y el idioma. Revisamos cada aviso y lo corregimos en la próxima actualización.", "q5": "¿Qué es el ambiente «Adultos 18+» de Say It!?", "a5": "Añade preguntas francas sobre relaciones para adultos. El juego pregunta una vez si todos tienen 18 años o más, y estas cartas nunca aparecen a menos que elijas este ambiente. El ambiente «Familia» es apto para todos.", "q6": "Compré el Evening Pass: ¿cómo lo restauro?", "a6": "El Evening Pass llegará pronto. Después de comprarlo, podrás restaurarlo en otro dispositivo desde ⚙️ «Ajustes» → «Restaurar compras», usando la misma cuenta de App Store o Google Play.", "q7": "¿Qué pasa con nuestros nombres y puntos?", "a7": "Se guardan solo en tu dispositivo y nunca se nos envían. Encontrarás los detalles en la política de privacidad."}, "ru": {"back": "← bfep.space", "s_title": "Поддержка", "s_lead": "Вопросы, идеи или нашли ошибку в подсказке или вопросе? Напишите нам — обычно отвечаем в течение двух рабочих дней.", "s_mail": "Почта", "s_copy": "Скопировать адрес", "s_copied": "Скопировано", "s_faq": "Частые вопросы", "privacy": "Политика конфиденциальности", "support": "Поддержка", "copy": "© 2026 Best Fun Evening", "q1": "Нужен ли интернет или аккаунт?", "a1": "Нет. Все четыре игры работают без интернета, без регистрации и аккаунта.", "q2": "Как сменить язык?", "a2": "Нажмите на кнопку языка на главном экране игры или откройте ⚙️ Настройки → Язык.", "q3": "Как сбросить очки или статистику?", "a3": "Откройте ⚙️ Настройки. Best Fun Evening Plan! и Bluff Night: «Очистить очки вечера». Three Clues Daily: «Сбросить статистику». Say It!: «Сбросить сыгранные карточки».", "q4": "Подсказка или вопрос неверные или неуместные.", "a4": "Пришлите нам снимок экрана и напишите, какая игра и какой язык. Мы проверяем каждое сообщение и исправляем в следующем обновлении.", "q5": "Что такое настроение «Взрослые 18+» в Say It!?", "a5": "Оно добавляет откровенные вопросы про отношения для взрослых. Игра один раз спрашивает, всем ли есть 18, и такие карточки появляются только если выбрать это настроение. «Семейный» подходит всем.", "q6": "Я купил Evening Pass — как его восстановить?", "a6": "Evening Pass скоро появится. После покупки его можно будет восстановить на другом устройстве: ⚙️ Настройки → Восстановить покупки, с тем же аккаунтом App Store или Google Play.", "q7": "Что происходит с нашими именами и очками?", "a7": "Они хранятся только на вашем устройстве и никогда не отправляются нам. Подробнее — в политике конфиденциальности."}, "fr": {"back": "← bfep.space", "s_title": "Assistance", "s_lead": "Une question, une idée, ou tu as trouvé un indice ou une question erronée ? Écris-nous – nous répondons généralement sous deux jours ouvrés.", "s_mail": "E-mail", "s_copy": "Copier l'adresse", "s_copied": "Copié", "s_faq": "Questions fréquentes", "privacy": "Politique de confidentialité", "support": "Assistance", "copy": "© 2026 Best Fun Evening", "q1": "Faut-il une connexion internet ou un compte ?", "a1": "Non. Les quatre jeux fonctionnent hors ligne, sans inscription ni compte.", "q2": "Comment changer de langue ?", "a2": "Touche l'un des boutons de langue sur l'écran d'accueil du jeu, ou ouvre ⚙️ « Réglages » → « Langue ».", "q3": "Comment effacer les scores ou les statistiques ?", "a3": "Ouvre ⚙️ « Réglages ». Best Fun Evening Plan! et Bluff Night : « Effacer les scores de la soirée ». Three Clues Daily : « Réinitialiser les statistiques ». Say It! : « Réinitialiser les cartes jouées ».", "q4": "Un indice ou une question est erroné ou inapproprié.", "a4": "Envoie-nous une capture d'écran en précisant le jeu et la langue. Nous vérifions chaque signalement et corrigeons l'erreur dans la prochaine mise à jour.", "q5": "Qu'est-ce que l'ambiance « Adultes 18+ » dans Say It! ?", "a5": "Elle ajoute des questions franches sur les relations, pour les adultes. Le jeu demande une fois si tout le monde a 18 ans ou plus, et ces cartes n'apparaissent jamais si vous ne choisissez pas cette ambiance. L'ambiance « Famille » convient à tout le monde.", "q6": "J'ai acheté l'Evening Pass – comment le restaurer ?", "a6": "L'Evening Pass arrive bientôt. Après l'achat, tu pourras le restaurer sur un autre appareil via ⚙️ « Réglages » → « Restaurer les achats », avec le même compte App Store ou Google Play.", "q7": "Que deviennent nos noms et nos scores ?", "a7": "Ils sont enregistrés uniquement sur ton appareil et ne nous sont jamais envoyés. Tous les détails sont dans la politique de confidentialité."}, "zh": {"back": "← bfep.space", "s_title": "支持", "s_lead": "有问题、有想法，或者发现了错误的线索或问题？给我们写信吧——我们通常会在两个工作日内回复。", "s_mail": "电子邮件", "s_copy": "复制地址", "s_copied": "已复制", "s_faq": "常见问题", "privacy": "隐私政策", "support": "支持", "copy": "© 2026 Best Fun Evening", "q1": "需要联网或注册账号吗？", "a1": "不需要。四款游戏都能离线使用，无需注册，也无需账号。", "q2": "如何更改语言？", "a2": "在游戏主屏幕上点按任一语言按钮，或打开 ⚙️“设置”→“语言”。", "q3": "如何清除分数或统计数据？", "a3": "打开 ⚙️“设置”。Best Fun Evening Plan! 和 Bluff Night：“清除今晚分数”。Three Clues Daily：“重置统计”。Say It!：“重置已玩卡牌”。", "q4": "某条线索或问题有错误或不妥。", "a4": "请发送截图给我们，并注明游戏名称和语言。我们会核查每一条反馈，并在下次更新中修正。", "q5": "Say It! 中的“成人 18+”氛围是什么？", "a5": "它会加入面向成年人的、关于感情关系的坦率问题。游戏会询问一次是否所有人都已年满 18 岁；除非你选择这个氛围，否则这些卡牌绝不会出现。“家庭”氛围适合所有人。", "q6": "我买了 Evening Pass——如何恢复？", "a6": "Evening Pass 即将推出。购买后，你可以在另一台设备上使用同一个 App Store 或 Google Play 账号，通过 ⚙️“设置”→“恢复购买”进行恢复。", "q7": "我们的名字和分数会怎样处理？", "a7": "它们只保存在你的设备上，绝不会发送给我们。详情请见隐私政策。"}}, LANGS=["en", "de", "es", "ru", "fr", "zh"];
function pick(){ let l=null; try{ l=localStorage.getItem('bfep-site-lang'); }catch(e){}
  if(!l){ const n=(navigator.language||'en').toLowerCase(); l=LANGS.find(x=>n.startsWith(x))||'en'; } return T[l]?l:'en'; }
function setLang(l){ try{ localStorage.setItem('bfep-site-lang',l); }catch(e){}
  document.documentElement.lang=l==='zh'?'zh-CN':l;
  document.querySelectorAll('[data-i]').forEach(el=>{ const v=T[l][el.dataset.i]; if(v!==undefined) el.textContent=v; });

setLang(pick());
