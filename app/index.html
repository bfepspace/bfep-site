<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F3B47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Best Fun Evening</title>
<style>
@font-face{font-family:'Fredoka';font-weight:500 700;font-display:swap;src:url('fonts/Fredoka-Variable.woff2') format('woff2')}
@font-face{font-family:'Nunito';font-weight:500 800;font-display:swap;src:url('fonts/Nunito-Variable.woff2') format('woff2')}
</style>
<style>
/* Layout: one-column phone app, BFEP game style (teal table, paper cards, sun buttons). Deliberate single dark look, same as all BFEP games. */
:root{
  color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#0F3B47; --bg2:#0B2E38; --paper:#FFF8EA; --ink:#12242B; --muted:#5A6B70;
  --sun:#FFC83D; --coral:#FF6A4D; --leaf:#3FB77F; --sky:#5CC8F2; --plum:#B57BEA;
  --disp:'Fredoka','Nunito',system-ui,sans-serif; --body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{background:var(--bg2)}
body{font-family:var(--body);font-weight:600;color:var(--paper);background:var(--bg2);
  background:radial-gradient(120% 90% at 50% 0%,var(--bg) 0%,var(--bg2) 100%) fixed;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
h1,h2,h3,.disp{font-family:var(--disp);font-weight:700;text-wrap:balance}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.screen{display:none;max-width:560px;margin:0 auto;min-height:100%;flex-direction:column;gap:16px;
  padding-block:16px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen.on{display:flex}
.btn{background:var(--sun);color:var(--ink);font-family:var(--disp);font-weight:600;font-size:1.15rem;padding:15px 22px;border-radius:16px;box-shadow:0 5px 0 #C99521;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #C99521}
.btn.ghost{background:transparent;color:var(--paper);box-shadow:none;border:2px solid rgba(255,248,234,.4);font-size:1rem;padding:11px 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{width:44px;height:44px;border-radius:50%;background:rgba(255,248,234,.1);font-size:1.4rem;display:grid;place-items:center;flex:none}
.langs{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.langs button{font-size:.78rem;font-weight:800;letter-spacing:.06em;padding:6px 8px;border-radius:10px;opacity:.6}
.topr{display:flex;align-items:flex-start;gap:8px}
.sndbtn{font-size:1.15rem;line-height:1;padding:6px 9px;border-radius:10px;background:rgba(255,248,234,.12)}
.sndbtn.off{opacity:.55}
.langs button.on{background:var(--paper);color:var(--ink);opacity:1}
/* home */
.hero{padding:6px 0 2px}
.brand{font-family:var(--disp);font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;color:var(--sun)}
.hero h1{font-size:2.3rem;line-height:1.02;margin-top:6px}
.hero p{opacity:.8;margin-top:8px;font-size:1rem}
.sect{display:flex;flex-direction:column;gap:10px}
.sect h2{font-size:1.05rem;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{position:relative;text-align:left;background:var(--paper);color:var(--ink);border-radius:20px;padding:14px 14px 16px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .1s}
.tile:active{transform:scale(.97)}
.tile .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:1.2rem;color:var(--ink)}
.tile b{font-family:var(--disp);font-weight:600;font-size:1.05rem;line-height:1.15}
.tile small{display:block;font-size:.8rem;color:var(--muted);margin-top:2px;font-weight:700}
.tile .soon{position:absolute;top:12px;right:12px;font-size:.66rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:3px 7px;border-radius:8px}
.tile.dim{opacity:.72}
.tile.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px}
.pass{background:linear-gradient(135deg,var(--sun),#FFA94D);color:var(--ink);border-radius:20px;padding:16px;display:flex;gap:12px;align-items:center}
.pass b{font-family:var(--disp);font-size:1.1rem}
.pass p{font-size:.88rem;font-weight:700;opacity:.8}
.foot{text-align:center;font-size:.78rem;opacity:.55}
/* finger */
#s-finger{padding-bottom:16px}
.ftitle{font-size:1.5rem}
.modes{display:flex;gap:6px;background:rgba(255,248,234,.08);padding:4px;border-radius:14px;align-self:flex-start;flex-wrap:wrap}
.modes button{padding:8px 12px;border-radius:10px;font-weight:800;font-size:.9rem;opacity:.7}
.modes button.on{background:var(--paper);color:var(--ink);opacity:1}
.pad{position:relative;flex:1;min-height:58vh;border-radius:26px;background:radial-gradient(circle at 50% 42%,#1E6B7E 0%,#14505F 55%,#0C3946 100%);
  box-shadow:inset 0 0 0 6px rgba(255,248,234,.08),inset 0 10px 40px rgba(0,0,0,.45);touch-action:none;overflow:hidden}
.padmsg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;pointer-events:none;gap:8px}
.padmsg .big{font-family:var(--disp);font-size:1.6rem;line-height:1.15}
.padmsg .sm{opacity:.7;font-size:.9rem}
.dot{position:absolute;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;pointer-events:none;
  border:6px solid var(--c);box-shadow:0 0 0 6px rgba(0,0,0,.15),0 0 30px var(--c);transition:transform .25s,opacity .3s}
.dot::after{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--c);opacity:.35}
.dot.pulse{animation:pulse 1s ease-in-out infinite}
.dot.lose{opacity:.12;transform:scale(.7)}
.dot.win{transform:scale(1.35);animation:none}
.ring{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px;border-radius:50%;pointer-events:none}
@keyframes pulse{50%{transform:scale(1.12)}}
.count{position:absolute;top:14px;left:0;right:0;text-align:center;font-family:var(--disp);font-size:1rem;opacity:.85;pointer-events:none}
/* wheel */
.wheelbox{position:relative;width:min(100%,400px);aspect-ratio:1;align-self:center}
#wheel{width:100%;height:100%;display:block}
.pointer{position:absolute;top:-6px;left:50%;width:0;height:0;margin-left:-16px;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--paper);filter:drop-shadow(0 3px 2px rgba(0,0,0,.4))}
.result{text-align:center;font-family:var(--disp);font-size:1.5rem;min-height:2.2em;color:var(--sun);display:flex;align-items:center;justify-content:center}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{background:rgba(255,248,234,.1);padding:8px 12px;border-radius:12px;font-size:.88rem;font-weight:800}
.chips button.on{background:var(--paper);color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:6px}
.opt input{flex:1;min-width:0;font:inherit;font-weight:700;padding:10px 12px;border-radius:12px;border:2px solid transparent;background:var(--paper);color:var(--ink);user-select:text;-webkit-user-select:text}
.opt button{width:44px;border-radius:12px;background:rgba(255,248,234,.1);font-size:1.2rem}
.note{font-size:.8rem;opacity:.6;text-align:center}
/* truth or dare */
.tdcard{background:var(--paper);color:var(--ink);border-radius:26px;padding:28px 22px;min-height:260px;display:flex;flex-direction:column;justify-content:center;gap:14px;box-shadow:0 8px 0 rgba(0,0,0,.25);text-align:center;transition:transform .35s}
.tdcard.flip{transform:rotateY(90deg)}
.tdkind{font-family:var(--disp);font-size:.9rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.tdtext{font-family:var(--disp);font-weight:600;font-size:1.55rem;line-height:1.2;text-wrap:balance}
.tdwho{font-size:.95rem;color:var(--muted);font-weight:800}
.tdbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.truth{background:var(--sky);box-shadow:0 5px 0 #3A93B5}
.btn.dare{background:var(--coral);color:var(--paper);box-shadow:0 5px 0 #C24A33}
/* sounds */
.sgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sbtn{aspect-ratio:1;max-width:100%;border-radius:22px;background:var(--c);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 5px 0 rgba(0,0,0,.3);transition:transform .08s,box-shadow .08s;padding:6px}
.sbtn:active,.sbtn.hit{transform:translateY(4px) scale(.97);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.sbtn span{font-size:1.8rem;line-height:1}
.sbtn b{font-family:var(--disp);font-weight:600;font-size:.88rem;line-height:1.1;text-align:center}
/* crew */
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:6px;background:rgba(255,248,234,.08);border-radius:16px;padding:6px 6px 6px 12px}
.prow i{width:14px;height:14px;border-radius:50%;background:var(--c);flex:none}
.prow input{flex:1;min-width:0;font:inherit;font-weight:800;font-size:1.05rem;background:transparent;border:0;color:var(--paper);padding:8px 4px;user-select:text;-webkit-user-select:text}
.prow input::placeholder{color:rgba(255,248,234,.4)}
.prow button{width:40px;height:40px;border-radius:12px;background:rgba(255,248,234,.12);font-size:1.3rem;font-weight:800;flex:none}
.prow button.plus{background:var(--sun);color:var(--ink)}
.prow button.del{background:transparent;opacity:.5;width:30px}
.prow .pts{min-width:2ch;text-align:center;font-family:var(--disp);font-size:1.3rem;font-variant-numeric:tabular-nums}
.prow .crown{width:1.4em;text-align:center}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.story{width:min(100%,360px);aspect-ratio:9/16;align-self:center;border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.4);background:var(--bg2)}
.field{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:800;opacity:.9;min-width:0}
.field input{font:inherit;font-weight:700;font-size:1rem;padding:11px 12px;border-radius:12px;border:0;background:var(--paper);color:var(--ink);user-select:text;-webkit-user-select:text;min-width:0;width:100%}
.msg{background:rgba(255,248,234,.08);border-radius:14px;padding:12px 14px;font-weight:700;line-height:1.4;user-select:text;-webkit-user-select:text}
@media (max-width:360px){.sgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
[hidden]{display:none!important}
#gameview{position:fixed;inset:0;z-index:20;background:var(--bg2);display:flex;flex-direction:column}
#gameview iframe{flex:1;border:0;width:100%}
#gameclose{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:calc(8px + env(safe-area-inset-left,0px));z-index:2;width:40px;height:40px;border-radius:50%;background:rgba(11,46,56,.85);color:var(--paper);font-size:1.3rem;display:grid;place-items:center}
@media (prefers-reduced-motion:reduce){.dot.pulse{animation:none}.tdcard{transition:none}}
</style>
</head>
<body>

<div id="s-home" class="screen on">
  <div class="top"><span class="brand">Best Fun Evening</span><div class="topr"><button type="button" class="sndbtn" id="sndbtn"></button><div class="langs" id="langs"></div></div></div>
  <div class="hero">
    <h1 data-t="slogan"></h1>
    <p data-t="sub"></p>
  </div>
  <div class="sect"><h2 data-t="h_play"></h2><div class="grid" id="g-play"></div></div>
  <div class="sect"><h2 data-t="h_decide"></h2><div class="grid" id="g-decide"></div></div>
  <div class="sect"><h2 data-t="h_fun"></h2><div class="grid" id="g-fun"></div></div>
  <div class="sect"><h2 data-t="h_night"></h2><div class="grid" id="g-night"></div></div>
  <div class="pass"><div class="tile ic" style="all:unset;font-size:1.8rem">★</div><div><b>Evening Pass</b><p data-t="pass"></p></div></div>
  <p class="foot" data-t="proto"></p>
</div>

<div id="s-finger" class="screen">
  <div class="top"><button class="back" data-home aria-label="Back">‹</button><h2 class="ftitle" data-t="finger"></h2><span style="width:44px"></span></div>
  <div class="modes" id="fmodes"></div>
  <div class="pad" id="pad"><div class="count" id="fcount"></div><div class="padmsg" id="padmsg"><div class="big" id="padbig"></div><div class="sm" id="padsm"></div></div></div>
</div>

<div id="s-wheel" class="screen">
  <div class="top"><button class="back" data-home aria-label="Back">‹</button><h2 class="ftitle" data-t="wheel"></h2><span style="width:44px"></span></div>
  <div class="chips" id="presets"></div>
  <div class="wheelbox"><canvas id="wheel" width="800" height="800"></canvas><div class="pointer"></div></div>
  <div class="result" id="wres"></div>
  <button class="btn" id="spin" data-t="spin"></button>
  <div class="opts" id="opts"></div>
  <button class="btn ghost" id="addopt" data-t="add"></button>
</div>

<div id="gameview" hidden><button id="gameclose" aria-label="Close">×</button><iframe id="gameframe" title="Game"></iframe></div>

<div id="s-crew" class="screen">
  <div class="top"><button class="back" data-home aria-label="Back">‹</button><h2 class="ftitle" data-t="crew_t"></h2><span style="width:44px"></span></div>
  <p class="note" id="crewempty" data-t="noplayers"></p>
  <div class="plist" id="crewlist"></div>
  <button class="btn ghost" id="addp" data-t="addp"></button>
  <div class="row2"><button class="btn ghost" id="newev" data-t="reset"></button><button class="btn" id="torecap" data-t="recap"></button></div>
</div>

<div id="s-recap" class="screen">
  <div class="top"><button class="back" data-home aria-label="Back">‹</button><h2 class="ftitle" data-t="recap_t"></h2><span style="width:44px"></span></div>
  <img class="story" id="recapimg" alt="">
  <p class="note" data-t="hold_save"></p>
  <button class="btn ghost" id="tocrew" data-t="crew_t"></button>
</div>

<div id="s-invite" class="screen">
  <div class="top"><button class="back" data-home aria-label="Back">‹</button><h2 class="ftitle" data-t="inv_t"></h2><span style="width:44px"></span></div>
  <label class="field"><span data-t="inv_host"></span><input type="text" id="ihost" maxlength="20"></label>
  <div class="row2"><label class="field"><span data-t="inv_when"></span><input type="text" id="iwhen" maxlength="24"></label><label class="field"><span data-t="inv_where"></span><input type="text" id="iwhere" maxlength="28"></label></div>
  <div class="msg" id="imsg"></div>
  <button class="btn" id="icopy" data-t="copy"></button>
  <img class="story" id="invimg" alt="">
  <p class="note" data-t="hold_save"></p>
</div>

<div id="s-toast" class="screen">
  <div class="top"><button class="back" data-home aria-label="Back">‹</button><h2 class="ftitle" data-t="toast"></h2><span style="width:44px"></span></div>
  <div class="chips" id="occ"></div>
  <label class="field" id="tnamebox"><span data-t="pname"></span><input type="text" id="tname" maxlength="24"></label>
  <div class="tdcard"><div class="tdkind" id="tocc"></div><div class="tdtext" id="ttext"></div></div>
  <button class="btn" id="tnext" data-t="another"></button>
  <button class="btn ghost" id="tcopy" data-t="copy"></button>
</div>

<div id="s-cards" class="screen">
  <div class="top"><button class="back" data-home aria-label="Back">‹</button><h2 class="ftitle" data-t="cards"></h2><span style="width:44px"></span></div>
  <div class="tdcard" id="tdcard"><div class="tdkind" id="tdkind"></div><div class="tdtext" id="tdtext"></div><div class="tdwho" id="tdwho"></div></div>
  <div class="tdbtns"><button class="btn truth" id="btruth" data-t="truth"></button><button class="btn dare" id="bdare" data-t="dare"></button></div>
  <button class="btn ghost" id="brand" data-t="random"></button>
  <p class="note" data-t="td_note"></p>
</div>

<div id="s-sounds" class="screen">
  <div class="top"><button class="back" data-home aria-label="Back">‹</button><h2 class="ftitle" data-t="sounds"></h2><span style="width:44px"></span></div>
  <div class="sgrid" id="sgrid"></div>
  <p class="note" data-t="snd_note"></p>
</div>

function tdDraw(kind){const list=TD[L][kind];if(tdUsed[kind].size>=list.length)tdUsed[kind].clear();let i;do{i=Math.floor(Math.random()*list.length)}while(tdUsed[kind].has(i));tdUsed[kind].add(i);stat("card");
  tdState={kind,i,turn:tdState.turn+1};const c=document.getElementById("tdcard");const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  if(reduce)tdRender();else{c.classList.add("flip");setTimeout(()=>{tdRender();c.classList.remove("flip")},180)}buzz(30)}
function tdRender(){const k=document.getElementById("tdkind"),x=document.getElementById("tdtext"),w=document.getElementById("tdwho");
  if(!tdState.kind){k.textContent="";x.textContent=t("td_start");w.textContent="";return}

let AC=null,OUT=null;function ac(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();OUT=AC.createGain();OUT.gain.value=SOUND;OUT.connect(AC.destination)}if(AC.state==="suspended")AC.resume();return AC}
function tone(f,t0,d,type="square",v=.18,f2){const a=ac(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime+t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+t0+d);
  g.gain.setValueAtTime(0,a.currentTime+t0);g.gain.linearRampToValueAtTime(v,a.currentTime+t0+.01);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t0+d);o.connect(g).connect(OUT);o.start(a.currentTime+t0);o.stop(a.currentTime+t0+d+.05)}
function noise(t0,d,v=.3,hp=0,lp=0){const a=ac(),n=a.sampleRate*d,b=a.createBuffer(1,n,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<n;i++)ch[i]=Math.random()*2-1;
  const s=a.createBufferSource();s.buffer=b;let node=s;if(hp){const f=a.createBiquadFilter();f.type="highpass";f.frequency.value=hp;node.connect(f);node=f}if(lp){const f=a.createBiquadFilter();f.type="lowpass";f.frequency.value=lp;node.connect(f);node=f}
  const g=a.createGain();g.gain.setValueAtTime(v,a.currentTime+t0);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t0+d);node.connect(g).connect(OUT);s.start(a.currentTime+t0);s.stop(a.currentTime+t0+d+.02)}
/* Drum roll and drum fill (chosen by Arkadii 18.10, variants Д1 and Д3): rendered once offline, then played. */
const DR={nb(c,sec){const b=c.createBuffer(1,Math.floor(c.sampleRate*sec),c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b},
 env(g,t,peak,att,dec){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+att);g.gain.setTargetAtTime(0,t+att,dec)},
 bus(c,wet,sec,dec){const dry=c.createGain(),out=c.createDynamicsCompressor();out.threshold.value=-10;out.ratio.value=4;out.connect(c.destination);dry.connect(out);
  const n=Math.floor(c.sampleRate*sec),b=c.createBuffer(2,n,c.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,dec)}

function storyBase(x,title){const W=1080,H=1920;const g=x.createRadialGradient(540,300,100,540,900,1500);g.addColorStop(0,"#16566A");g.addColorStop(1,"#071F26");x.fillStyle=g;x.fillRect(0,0,W,H);
  const cs=["#FFC83D","#FF6A4D","#3FB77F","#5CC8F2","#B57BEA","#FF8FB1"];let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  for(let i=0;i<70;i++){x.save();x.translate(rnd()*W,rnd()*H);x.rotate(rnd()*6);x.fillStyle=cs[i%6];x.globalAlpha=.55;x.fillRect(-14,-6,28,12);x.restore()}x.globalAlpha=1;
  x.textAlign="center";x.fillStyle="#FFC83D";x.font="700 44px Fredoka, Nunito, sans-serif";x.fillText("BEST FUN EVENING",540,170);
  x.fillStyle="#FFF8EA";x.font="700 110px Fredoka, Nunito, sans-serif";x.fillText(title,540,320)}

function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()}

  let y=860;sorted.slice(0,6).forEach((p,i)=>{x.fillStyle="rgba(255,248,234,.1)";rr(x,90,y-62,900,92,30);x.fill();x.fillStyle=p.c;x.beginPath();x.arc(150,y-16,22,0,7);x.fill();
    x.textAlign="left";x.fillStyle="#FFF8EA";x.font="700 50px Nunito, sans-serif";x.fillText(`${i+1}. ${p.n}`,200,y,560);x.textAlign="right";x.fillStyle="#FFC83D";x.fillText(`${p.p} ${t("pts")}`,960,y);x.textAlign="center";y+=110});
  const st=[["pick","☝"],["spin","✺"],["card","♠"],["snd","♪"]];const sy=Math.max(y+40,1420);
  st.forEach(([k,ic],i)=>{const cx=90+i*225+105;x.fillStyle="#FFC83D";x.font="700 80px Fredoka, Nunito, sans-serif";x.fillText(stats[k],cx,sy);x.fillStyle="rgba(255,248,234,.8)";x.font="700 30px Nunito, sans-serif";
    const words=t("stat_"+k).split(" ");let line="",ly=sy+50;words.forEach(w=>{if(x.measureText(line+w).width>200&&line){x.fillText(line.trim(),cx,ly);line="";ly+=36}line+=w+" "});x.fillText(line.trim(),cx,ly)});
