# Не даёт Supabase (бесплатный тариф) поставить проект на паузу. v1.2 (11.11.2026)
# 11.11 Supabase всё равно предупредил о паузе: прежние запросы (настройки входа
# и отказ в доступе к bomi_state) не считаются активностью базы.
# Теперь дважды в день: настоящий SELECT из таблицы settings и запись времени
# через функцию keepalive_ping (SQL keepalive-v1.0 в Supabase SQL Editor).
# Ключ публичный (publishable), не секрет. Красный запуск = проект не отвечает.
name: Supabase keepalive
on:
  schedule:
    - cron: "17 4 * * *"    # 08:17 Дубай
    - cron: "17 16 * * *"   # 20:17 Дубай
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          URL: https://ilpsfsrhfttjitewdtfk.supabase.co
          KEY: sb_publishable_8OFtlVxlBU9zT_huEO9gvQ_v-05NnKK
        run: |
          H=(-H "apikey: $KEY" -H "Content-Type: application/json")
          a=$(curl -sS -o /dev/null -w "%{http_code}" "$URL/auth/v1/settings" "${H[@]}" || echo 000)
          s=$(curl -sS -o /dev/null -w "%{http_code}" "$URL/rest/v1/settings?select=key&limit=1" "${H[@]}" || echo 000)
          k=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "$URL/rest/v1/rpc/keepalive_ping" "${H[@]}" -d '{}' || echo 000)
          r=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "$URL/rest/v1/rpc/bomi_state" "${H[@]}" -d '{}' || echo 000)
          echo "::notice title=Supabase::auth $a, select $s, keepalive_ping $k, rest $r"
          if [ "$k" != "200" ]; then
            echo "::warning title=Supabase::keepalive_ping $k (SQL keepalive-v1.0 not applied yet?)"
          fi
          if [ "$a" != "200" ] || [ "$s" = "000" ] || [ "$s" -ge 500 ] || [ "$r" = "000" ] || [ "$r" -ge 500 ]; then
            echo "::error title=Supabase::project not responding (auth $a, select $s, rest $r)"; exit 1
          fi
