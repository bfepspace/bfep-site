# Не даёт Supabase (бесплатный тариф) поставить проект на паузу:
# раз в день обращается к базе. Ключ публичный (publishable), не секрет.
name: Supabase keepalive
on:
  schedule:
    - cron: "17 4 * * *"   # каждый день 08:17 Дубай
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          URL: https://ilpsfsrhfttjitewdtfk.supabase.co
          KEY: sb_publishable_8OFtlVxlBU9zT_huEO9gvQ_v-05NnKK
        run: |
          curl -sS -o /dev/null -w "auth %{http_code}\n" "$URL/auth/v1/settings" -H "apikey: $KEY"
          curl -sS -o /dev/null -w "rest %{http_code}\n" -X POST "$URL/rest/v1/rpc/bomi_state" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
